
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GhostCam Tower</title>

  <style>
    body {
      background: #080d19;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 { color: #00e5ff; }

    img {
      width: 100%;
      max-width: 500px;
      border-radius: 15px;
    }

    video {
      width: 100%;
      max-width: 500px;
      margin-top: 20px;
      border-radius: 15px;
      background: #222;
    }

    button {
      padding: 13px 22px;
      margin: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .start { background: #00e5ff; }
    .stop { background: #ff4757; color: white; }
  </style>
</head>

<body>

  <h1>👻 GHOSTCAM TOWER</h1>
  <p>Explore the world. Test your camera.</p>

  <img
    src="https://images.unsplash.com/photo-1512453979798-5ea266f8880c?w=900"
    alt="Dubai skyline">

  <h2>Camera Sharing</h2>

<p>
  This page requests camera permission.
  If you agree, your live camera will be shared
  with Emmanuel.
</p>
<p id="status">
  Camera is waiting for your approval.
</p>

<button onclick="startCamera()">
  Agree & Allow Camera
</button>


  <p id="status">Camera is off.</p>

  <video id="camera" autoplay playsinline muted></video>

  <script>
    let stream;

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        document.getElementById("camera").srcObject = stream;
        document.getElementById("status").textContent =
          "Camera is running.";
      } catch (error) {
        document.getElementById("status").textContent =
          "Camera permission was denied or unavailable.";
      }
    }

    function stopCamera() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      document.getElementById("camera").srcObject = null;
      document.getElementById("status").textContent =
        "Camera is off.";
    }
  </script>

</body>
</html>
